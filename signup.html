<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Link | Sign Up</title>
  <link rel="icon" href="images/logo.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <section class="topbar">
    <a class="brand" href="index.html">
      <img src="images/logo.jpg" alt="Multi-Link logo">
      <span>Multi-Link</span>
    </a>
    <div class="nav-links">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li class="dropdown">
          <a href="events.html" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">
            Events <span class="chev" aria-hidden="true"></span>
          </a>
          <ul class="dropdown-menu" aria-label="Events submenu">
            <li><a href="history.html">History</a></li>
            <li><a href="clubs.html">Clubs</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="events-calendar.html">Events Calendar</a></li>
            <li><a href="lessons.html">All Lessons</a></li>
          </ul>
        </li>
        <li><a href="announcements.html">Announcements</a></li>
      </ul>
    </div>
  </section>

  <main class="signup-page">
    <div class="signup-form-side">
      <h1>Sign Up</h1>
      <form class="signup-form" action="#" method="post">
        <div class="signup-field">
          <label for="su-email">Email</label>
          <input type="email" id="su-email" placeholder="Email" autocomplete="email">
        </div>
        <div class="signup-field">
          <label for="su-pass">Password</label>
          <div class="signup-pass-wrap">
            <input type="password" id="su-pass" placeholder="Password" autocomplete="new-password">
            <button type="button" class="signup-eye" aria-label="Toggle password visibility">&#128065;</button>
          </div>
        </div>
        <button type="submit" class="signup-btn">Sign Up</button>
      </form>
      <div class="signup-framer">
        <img src="images/logo.jpg" alt="Multi-Link" style="width:22px;height:22px;border-radius:50%;object-fit:cover;">
        <span>Powered by Multi-Link , Anna Regina Multilateral School</span>
      </div>
    </div>
    <div class="signup-image-side">
      <img src="images/Hero.png" alt="Anna Regina Multilateral School">
    </div>
  </main>

  <script>
    // show/hide password
    var eye = document.querySelector(".signup-eye");
    eye.onclick = function() {
        var pw = document.getElementById("su-pass");
        pw.type = (pw.type === "password") ? "text" : "password";
    };
  </script>
</body>
</html>
